services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - chroma-data:/data/chroma
      - hf-cache:/cache/hf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s

volumes:
  chroma-data:
  hf-cache:
